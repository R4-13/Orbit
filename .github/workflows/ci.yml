name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: "postgresql://orbit:orbit_ci@localhost:5432/orbit_ci?schema=public"
  REDIS_URL: "redis://localhost:6379"
  S3_ENDPOINT: "http://localhost:9000"
  S3_ACCESS_KEY: "ci_minio_admin"
  S3_SECRET_KEY: "ci_minio_admin_secret"
  JWT_SECRET: "ci_only_jwt_secret_not_for_production_use"
  CREDENTIAL_ENCRYPTION_KEY: "Y2lfb25seV8zMl9ieXRlX2tleV9wbGFjZWhvbGRlcg=="

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_ci
          POSTGRES_DB: orbit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm prisma:migrate deploy || true

      - name: Unit & integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E tests
        run: pnpm test:e2e
        continue-on-error: false
