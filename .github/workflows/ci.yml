name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: "postgresql://orbit:orbit_ci@localhost:5432/orbit_ci?schema=public"
  DATABASE_URL_APP: "postgresql://orbit_app:orbit_app_ci@localhost:5432/orbit_ci?schema=public&connection_limit=20"
  REDIS_URL: "redis://localhost:6379"
  S3_ENDPOINT: "http://localhost:9000"
  S3_ACCESS_KEY: "ci_minio_admin"
  S3_SECRET_KEY: "ci_minio_admin_secret"
  JWT_SECRET: "ci_only_jwt_secret_not_for_production_use"
  CREDENTIAL_ENCRYPTION_KEY: "Y2lfb25seV8zMl9ieXRlX2tleV9wbGFjZWhvbGRlcg=="

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_ci
          POSTGRES_DB: orbit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        # bitnami's image (unlike minio/minio) auto-creates the bucket from
        # MINIO_DEFAULT_BUCKETS on startup, which GH Actions' `services:`
        # block needs since it has no equivalent of docker-compose's
        # one-shot `minio-init` container / custom command override.
        image: bitnami/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: ci_minio_admin
          MINIO_ROOT_PASSWORD: ci_minio_admin_secret
          MINIO_DEFAULT_BUCKETS: orbit-documents
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Provision restricted DB role (for Row-Level Security)
        # GH Actions service containers start before checkout, so they
        # can't mount docker/postgres/10-init-app-role.sh the way
        # docker-compose*.yml does (see docs/ASSUMPTIONS.md Phase 15) —
        # this step does the same thing explicitly, before any migration
        # creates a table, so the ALTER DEFAULT PRIVILEGES rule below
        # covers every table `prisma migrate deploy` is about to create.
        run: |
          PGPASSWORD=orbit_ci psql -h localhost -U orbit -d orbit_ci -v ON_ERROR_STOP=1 <<-'EOSQL'
            CREATE ROLE orbit_app LOGIN PASSWORD 'orbit_app_ci'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            GRANT CONNECT ON DATABASE orbit_ci TO orbit_app;
            GRANT USAGE ON SCHEMA public TO orbit_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE orbit IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO orbit_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE orbit IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO orbit_app;
          EOSQL

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm prisma:deploy

      - name: Unit & integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Seed demo data
        run: pnpm prisma:seed

      - name: Install Playwright browsers
        run: pnpm --filter @orbit/web exec playwright install --with-deps chromium

      - name: Start API server (apps/web's Playwright suite calls it directly)
        run: |
          node apps/api/dist/src/main.js > api-server.log 2>&1 &
          echo $! > api-server.pid

      - name: Wait for API to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/v1/health > /dev/null; then
              echo "API is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time." >&2
          cat api-server.log
          exit 1

      - name: E2E tests
        run: pnpm test:e2e
        continue-on-error: false

      - name: Show API server log
        if: always()
        run: cat api-server.log

      - name: Stop API server
        if: always()
        run: kill "$(cat api-server.pid)" || true
