# Infra-only override for local development where you run api/web/worker
# directly on the host (pnpm dev) instead of in containers.
#
# Usage: docker compose -f docker-compose.dev.yml up -d
name: orbit-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_local_dev
      POSTGRES_DB: orbit
    ports:
      - "5432:5432"
    volumes:
      - orbit_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: orbit-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: orbit-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orbit_minio_admin
      MINIO_ROOT_PASSWORD: orbit_minio_admin_secret_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - orbit_minio_dev_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orbit_postgres_dev_data:
  orbit_minio_dev_data:
